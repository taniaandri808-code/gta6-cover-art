<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Cover Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <aside class="controls">
      <h1>NEON COVER STUDIO</h1>
      <div id="drop">Drop a photo here</div>
      <fieldset>
        <legend>PANEL 1</legend>
        <input type="file" id="p1" accept="image/*">
        <input type="range" id="z1" min="0.5" max="3" step="0.01" value="1">
        <small>Drag on the preview to pan.</small>
      </fieldset>
      <fieldset>
        <legend>PANEL 2</legend>
        <input type="file" id="p2" accept="image/*">
        <input type="range" id="z2" min="0.5" max="3" step="0.01" value="1">
      </fieldset>
      <fieldset>
        <legend>PANEL 3</legend>
        <input type="file" id="p3" accept="image/*">
        <input type="range" id="z3" min="0.5" max="3" step="0.01" value="1">
      </fieldset>
      <section id="captions">
        <input type="text" id="cap0" value="NEON">
        <input type="text" id="cap1">
        <input type="text" id="cap2">
        <input type="text" id="cap3">
      </section>
      <div id="palettes">
        <button id="pal-0"></button>
        <button id="pal-1"></button>
        <button id="pal-2"></button>
        <button id="pal-3"></button>
        <button id="pal-4"></button>
      </div>
      <div id="exports">
        <button id="exp1"></button>
        <button id="exp2"></button>
        <button id="exp3"></button>
      </div>
      <p id="status"></p>
    </aside>
    <div class="stage">
      <canvas id="preview" width="540" height="540"></canvas>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
